<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conventional Coding Agent Task</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body
  class="conventional-study"
  data-study-task="true"
  data-condition="conventional"
>

  <main class="conventional-layout">

    <div class="study-task-stack" aria-live="polite">

      <section id="task-brief-card" class="study-panel task-brief-card">
        <div class="panel-label">
          <span>Task brief</span>
          <span class="panel-label-line" aria-hidden="true"></span>
        </div>

        <h1 id="task-heading"></h1>

        <button
          id="task-intro-toggle"
          class="task-intro-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="task-intro"
        >
          Show task details
        </button>

        <div id="task-intro" class="task-intro-collapsible" hidden>
          <p id="task-blurb"></p>
          <p id="task-tech-note"></p>
          <p id="condition-note" class="condition-note" hidden>
            <span class="status-dot" aria-hidden="true"></span>
            <span class="condition-note-text"></span>
          </p>
        </div>
      </section>

      <section id="step-card" class="study-panel step-card">
        <div class="step-meta">
          <span id="task-progress">Step 1 of 6</span>
        </div>

        <h2 id="task-title"></h2>

        <div id="task-description"></div>

        <p id="task-continue-hint" class="continue-hint">
          When you are done with this step, check the box below and click Confirm.
        </p>

        <div id="step-confirm-block" class="step-confirm-block">
          <label class="step-confirm-label">
            <input
              id="step-finished-checkbox"
              type="checkbox"
            />
            I have finished this step
          </label>
        </div>

        <div class="task-footer">
          <button
            id="home-button"
            class="secondary-button"
            type="button"
            hidden
          >
            Back to study page
          </button>

          <button
            id="download-button"
            class="primary-button"
            type="button"
            hidden
          >
            Download timing CSV
          </button>

          <button
            id="confirm-button"
            class="primary-button"
            type="button"
            disabled
          >
            Confirm
          </button>
        </div>
      </section>

    </div>

  </main>

  <script src="study-task.js"></script>

</body>
</html>
